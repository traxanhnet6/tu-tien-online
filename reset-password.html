<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Đặt lại mật khẩu — Tu Tiên Online</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:#14100b url('../assets-ai/menu-nen-thuy-mac.webp') center/cover no-repeat fixed;margin:0;
    font-family:'Noto Sans VN',sans-serif;color:#e8dcc3;min-height:100vh}
  #rmsg{min-height:22px;text-align:center;font-weight:bold;margin-top:12px}
  #rmsg.err{color:#ff8a8a}#rmsg.ok{color:#8ae89a}
</style>
</head>
<body>
<div class="reset-wrap">
  <h1>Đặt lại mật khẩu</h1>
  <p class="auth-desc" id="rdesc">Đang kiểm tra link...</p>
  <div id="rform" class="hidden">
    <label class="fld-label">Mật khẩu mới</label>
    <input id="r-pw1" class="fld-input" type="password" maxlength="72" placeholder="Mật khẩu mới (≥ 6 ký tự)">
    <label class="fld-label">Nhập lại mật khẩu mới</label>
    <input id="r-pw2" class="fld-input" type="password" maxlength="72" placeholder="Nhập lại mật khẩu mới">
    <button id="r-btn" class="btn btn-jade big" type="button">Đổi mật khẩu</button>
  </div>
  <div id="rmsg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script>
(function () {
  var msgEl = document.getElementById("rmsg");
  var descEl = document.getElementById("rdesc");
  var formEl = document.getElementById("rform");
  function msg(t, err) { msgEl.textContent = t || ""; msgEl.className = t ? (err ? "err" : "ok") : ""; }
  function setDesc(t) { descEl.textContent = t; }

  var sb = null;
  try {
    sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
  } catch (e) {}
  if (!sb) { setDesc(""); msg("Chưa kết nối máy chủ.", true); return; }

  /* Link mail Supabase: ?code=... (PKCE) hoặc #access_token=... (implicit) */
  async function init() {
    try {
      var url = new URL(window.location.href);
      var code = url.searchParams.get("code");
      if (code) {
        var ex = await sb.auth.exchangeCodeForSession(code);
        if (ex.error) throw ex.error;
      }
      var u = await sb.auth.getUser();
      if (!u.data.user) throw new Error("bad");
      setDesc("Nhập mật khẩu mới cho tài khoản của bạn.");
      formEl.classList.remove("hidden");
    } catch (e) {
      setDesc("");
      msg("Link đã hết hạn hoặc không hợp lệ. Hãy yêu cầu gửi lại mail trong game.", true);
    }
  }

  document.getElementById("r-btn").onclick = async function () {
    var p1 = document.getElementById("r-pw1").value || "";
    var p2 = document.getElementById("r-pw2").value || "";
    if (p1.length < 6) { msg("Mật khẩu phải từ 6 ký tự trở lên.", true); return; }
    if (p1 !== p2) { msg("Mật khẩu nhập lại chưa khớp.", true); return; }
    msg("");
    try {
      var r = await sb.auth.updateUser({ password: p1 });
      if (r.error) throw r.error;
      formEl.classList.add("hidden");
      setDesc("");
      msg("Đổi mật khẩu thành công! Hãy đăng nhập lại trong game.", false);
    } catch (e) {
      msg((e && e.message) || "Có lỗi xảy ra.", true);
    }
  };

  init();
})();
</script>
</body>
</html>
